="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED · Qwen3.8-27B · PROBED 2026-08-14, LAUNCH DAY · wikitext-2</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">The 48 linear layers didn't flatten it</text><text x="80" y="216" fill="#b3bccb" font-size="24">Qwen3.8-27B is the first hybrid we've probed: 48 of 64 layers are linear attention. Our depth-fragility law survived it.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><text x="80" y="322" fill="#7d879c" font-size="20" letter-spacing="3">FRAGILITY PER DEPTH BAND  ·  DELTA PERPLEXITY WHEN THAT BAND IS PUSHED TO 2-BIT</text><line x1="250" y1="602" x2="1370" y2="602" stroke="#e8a87c" stroke-width="2.5" stroke-dasharray="10 7" opacity="0.85"/><text x="250" y="586" fill="#e8a87c" font-size="20">attention-type fragility would sit FLAT on this line</text><line x1="250" y1="760" x2="1370" y2="760" stroke="#394355" stroke-width="2"/><rect x="315" y="735" width="150" height="25" rx="8" fill="#b3bccb" opacity="0.9"/><text x="390" y="717" text-anchor="middle" fill="#f5f6f8" font-size="30" font-weight="bold">0.045</text><text x="390" y="796" text-anchor="middle" fill="#f5f6f8" font-size="24" font-weight="normal">layers 0-16</text><rect x="595" y="642" width="150" height="118" rx="8" fill="#b3bccb" opacity="0.9"/><text x="670" y="624" text-anchor="middle" fill="#f5f6f8" font-size="30" font-weight="bold">0.212</text><text x="670" y="796" text-anchor="middle" fill="#f5f6f8" font-size="24" font-weight="normal">layers 17-33</text><rect x="875" y="598" width="150" height="162" rx="8" fill="#b3bccb" opacity="0.9"/><text x="950" y="580" text-anchor="middle" fill="#f5f6f8" font-size="30" font-weight="bold">0.292</text><text x="950" y="796" text-anchor="middle" fill="#f5f6f8" font-size="24" font-weight="normal">layers 34-50</text><rect x="1155" y="432" width="150" height="328" rx="8" fill="#2dd4bf" opacity="1"/><text x="1230" y="414" text-anchor="middle" fill="#f5f6f8" font-size="30" font-weight="bold">0.593</text><text x="1230" y="796" text-anchor="middle" fill="#f5f6f8" font-size="24" font-weight="bold">layers 51-64</text><text x="1230" y="376" text-anchor="middle" fill="#2dd4bf" font-size="26" font-weight="bold">2.04x median</text><text x="1230" y="824" text-anchor="middle" fill="#2dd4bf" font-size="20" font-weight="bold">FRAGILE</text><text x="250" y="796" fill="#7d879c" font-size="20">FRONT</text><text x="1370" y="796" text-anchor="end" fill="#7d879c" font-size="20">BACK</text><text x="80" y="878" fill="#7d879c" font-size="19" letter-spacing="2">THE 64 LAYERS  ·  full attention every 4th (evenly across all four bands), linear attention between</text><rect x="250.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="267.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="285.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="302.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="320.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="337.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="355.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="372.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="390.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="407.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="425.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="442.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="460.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="477.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="495.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="512.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="530.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="547.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="565.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="582.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="600.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="617.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="635.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="652.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="670.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="687.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="705.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="722.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="740.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="757.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="775.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="792.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="810.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="827.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="845.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="862.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="880.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="897.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="915.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="932.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="950.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="967.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="985.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1002.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="1020.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1037.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1055.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1072.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="1090.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1107.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1125.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1142.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="1160.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1177.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1195.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1212.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="1230.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1247.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1265.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1282.5" y="892" width="15.5" height="26" fill="#e8a87c"/><rect x="1300.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1317.5" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1335.0" y="904" width="15.5" height="14" fill="#2a3340"/><rect x="1352.5" y="892" width="15.5" height="26" fill="#e8a87c"/><text x="1370" y="944" text-anchor="end" fill="#e8a87c" font-size="18">16 full-attention layers, 4 in every band - so attention-type fragility would read FLAT</text><rect x="80" y="988" width="462.6666666666667" height="172" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="311.33333333333337" y="1032" text-anchor="middle" fill="#2dd4bf" font-size="19" letter-spacing="3">FRAGILE BAND</text><text x="311.33333333333337" y="1096" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">51-64</text><text x="311.33333333333337" y="1134" text-anchor="middle" fill="#b3bccb" font-size="18">the back - like every full-attn Qwen</text><rect x="568.6666666666667" y="988" width="462.6666666666667" height="172" rx="18" fill="#1c222c" stroke="#f5f6f8" stroke-width="2"/><text x="800.0000000000001" y="1032" text-anchor="middle" fill="#f5f6f8" font-size="19" letter-spacing="3">vs STAKED BAR</text><text x="800.0000000000001" y="1096" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">2.04x</text><text x="800.0000000000001" y="1134" text-anchor="middle" fill="#b3bccb" font-size="18">staked >= 1.3x median, before the probe</text><rect x="1057.3333333333335" y="988" width="462.6666666666667" height="172" rx="18" fill="#1c222c" stroke="#b3bccb" stroke-width="2"/><text x="1288.6666666666667" y="1032" text-anchor="middle" fill="#b3bccb" font-size="19" letter-spacing="3">PROFILE SHAPE</text><text x="1288.6666666666667" y="1096" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">monotone</text><text x="1288.6666666666667" y="1134" text-anchor="middle" fill="#b3bccb" font-size="18">back-heavy, not flat -> depth, not type</text><text x="80" y="1188" fill="#7d879c" font-size="18">STAKED BEFORE THE PROBE (prereg #101, launch day). The stake was the SHAPE of the depth curve: back-heavy (worst band >= 1.3x median) confirms</text><text x="80" y="1214" fill="#7d879c" font-size="18">depth-localized fragility; a flat profile within 15% would have meant fragility lived in the evenly-spread full-attention layers instead. It came back</text><text x="80" y="1240" fill="#7d879c" font-size="18">monotone at 2.04x - depth wins.</text><text x="80" y="1279.0" fill="#7d879c" font-size="18">Measured from the Q4_K_M source, not BF16: the true-original probe is infeasible on a 6GB/16GB box (a 27B Q6 reference exceeds 16GB RAM). Relative band</text><text x="80" y="1305.0" fill="#7d879c" font-size="18">deltas survive a quantized source - the source's own quant is common-mode and cancels. The declared risk that Q4 could blunt fragility into a false flat</text><text x="80" y="1331.0" fill="#7d879c" font-size="18">did NOT fire: a 2x signal survived it.</text><text x="80" y="1370.0" fill="#7d879c" font-size="18">What this does NOT show yet: the benchmark ceiling (naive vs recipe on real tasks) and the Law-4 decode prediction for linear attention both need the</text><text x="80" y="1396.0" fill="#7d879c" font-size="18">BF16 27B, which is weeks per arm here - deferred to rented hardware, not claimed.</text><rect x="80" y="1494" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1494" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1494" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1542" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1542" text-anchor="end" fill="#7d879c" font-size="19">prereg 2026-08-14-qwen38-27b-hybrid-fragility · weights/data/prereg101_probe_qwen38_q4.log</text></svg>