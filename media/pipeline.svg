="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">PROBE · REBUILD · PLACE · RUN · SERVE · PROVE</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">Any model, rebuilt for your machine</text><text x="80" y="216" fill="#b3bccb" font-size="24">Not a calculator you consult once - the path from a model you found to the best version of it your hardware can serve.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><text x="88" y="326" fill="#2dd4bf" font-size="21" letter-spacing="3">ANY MODEL IN</text><text x="1512" y="326" text-anchor="end" fill="#2dd4bf" font-size="21" letter-spacing="3">SERVED, AND PROVEN</text><line x1="88" y1="344" x2="1512" y2="344" stroke="#2a3340" stroke-width="2"/><rect x="88" y="372" width="228" height="356" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="128" cy="414" r="21" fill="#2dd4bf"/><text x="128" y="423" text-anchor="middle" fill="#14181f" font-size="24" font-weight="bold">1</text><text x="162" y="424" fill="#f5f6f8" font-size="27" font-weight="bold">PROBE</text><text x="112" y="478" fill="#b3bccb" font-size="20">find which layers</text><text x="112" y="506" fill="#b3bccb" font-size="20">actually break</text><rect x="108" y="550" width="188" height="40" rx="8" fill="#14181f" stroke="#2a3340"/><text x="202.0" y="576" text-anchor="middle" fill="#2dd4bf" font-size="17" font-family="Consolas, Menlo, monospace">quantprobe probe</text><line x1="112" y1="616" x2="292" y2="616" stroke="#2a3340" stroke-width="1.5"/><text x="202.0" y="652" text-anchor="middle" fill="#f5f6f8" font-size="20" font-weight="bold">27x spread</text><text x="202.0" y="678" text-anchor="middle" fill="#7d879c" font-size="17" font-weight="normal">between bands</text><path d="M 317.5 542.0 L 328.5 550.0 L 317.5 558.0" fill="none" stroke="#7d879c" stroke-width="3"/><rect x="331" y="372" width="228" height="356" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="371" cy="414" r="21" fill="#2dd4bf"/><text x="371" y="423" text-anchor="middle" fill="#14181f" font-size="24" font-weight="bold">2</text><text x="405" y="424" fill="#f5f6f8" font-size="27" font-weight="bold">REBUILD</text><text x="355" y="478" fill="#b3bccb" font-size="20">quantize around</text><text x="355" y="506" fill="#b3bccb" font-size="20">what you found</text><rect x="351" y="550" width="188" height="40" rx="8" fill="#14181f" stroke="#2a3340"/><text x="445.0" y="576" text-anchor="middle" fill="#2dd4bf" font-size="17" font-family="Consolas, Menlo, monospace">quantprobe quantize</text><line x1="355" y1="616" x2="535" y2="616" stroke="#2a3340" stroke-width="1.5"/><text x="445.0" y="652" text-anchor="middle" fill="#f5f6f8" font-size="20" font-weight="bold">-13.2% ppl</text><text x="445.0" y="678" text-anchor="middle" fill="#7d879c" font-size="17" font-weight="normal">at equal bytes</text><path d="M 560.5 542.0 L 571.5 550.0 L 560.5 558.0" fill="none" stroke="#7d879c" stroke-width="3"/><rect x="574" y="372" width="228" height="356" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="614" cy="414" r="21" fill="#2dd4bf"/><text x="614" y="423" text-anchor="middle" fill="#14181f" font-size="24" font-weight="bold">3</text><text x="648" y="424" fill="#f5f6f8" font-size="27" font-weight="bold">PLACE</text><text x="598" y="478" fill="#b3bccb" font-size="20">split across</text><text x="598" y="506" fill="#b3bccb" font-size="20">VRAM / RAM / disk</text><rect x="594" y="550" width="188" height="40" rx="8" fill="#14181f" stroke="#2a3340"/><text x="688.0" y="576" text-anchor="middle" fill="#2dd4bf" font-size="17" font-family="Consolas, Menlo, monospace">quantprobe plan</text><line x1="598" y1="616" x2="778" y2="616" stroke="#2a3340" stroke-width="1.5"/><text x="688.0" y="652" text-anchor="middle" fill="#f5f6f8" font-size="20" font-weight="bold">9.0% median</text><text x="688.0" y="678" text-anchor="middle" fill="#7d879c" font-size="17" font-weight="normal">prediction error</text><path d="M 803.5 542.0 L 814.5 550.0 L 803.5 558.0" fill="none" stroke="#7d879c" stroke-width="3"/><rect x="817" y="372" width="228" height="356" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="857" cy="414" r="21" fill="#2dd4bf"/><text x="857" y="423" text-anchor="middle" fill="#14181f" font-size="24" font-weight="bold">4</text><text x="891" y="424" fill="#f5f6f8" font-size="27" font-weight="bold">RUN</text><text x="841" y="478" fill="#b3bccb" font-size="20">launch with the</text><text x="841" y="506" fill="#b3bccb" font-size="20">flags that fit</text><rect x="837" y="550" width="188" height="40" rx="8" fill="#14181f" stroke="#2a3340"/><text x="931.0" y="576" text-anchor="middle" fill="#2dd4bf" font-size="17" font-family="Consolas, Menlo, monospace">quantprobe run</text><line x1="841" y1="616" x2="1021" y2="616" stroke="#2a3340" stroke-width="1.5"/><text x="931.0" y="652" text-anchor="middle" fill="#f5f6f8" font-size="20" font-weight="bold">2.2x prefill</text><text x="931.0" y="678" text-anchor="middle" fill="#7d879c" font-size="17" font-weight="normal">vs naive -ngl</text><path d="M 1046.5 542.0 L 1057.5 550.0 L 1046.5 558.0" fill="none" stroke="#7d879c" stroke-width="3"/><rect x="1060" y="372" width="228" height="356" rx="18" fill="#20242e" stroke="#e8a87c" stroke-width="2.5"/><circle cx="1100" cy="414" r="21" fill="#e8a87c"/><text x="1100" y="423" text-anchor="middle" fill="#14181f" font-size="24" font-weight="bold">5</text><text x="1134" y="424" fill="#f5f6f8" font-size="27" font-weight="bold">SERVE</text><text x="1084" y="478" fill="#b3bccb" font-size="20">many sessions,</text><text x="1084" y="506" fill="#b3bccb" font-size="20">an API, a container</text><rect x="1080" y="550" width="188" height="40" rx="8" fill="#14181f" stroke="#2a3340"/><text x="1174.0" y="576" text-anchor="middle" fill="#e8a87c" font-size="17" font-family="Consolas, Menlo, monospace">quantprobe serve</text><line x1="1084" y1="616" x2="1264" y2="616" stroke="#2a3340" stroke-width="1.5"/><text x="1174.0" y="652" text-anchor="middle" fill="#f5f6f8" font-size="20" font-weight="bold">23 -> 219 tok/s</text><text x="1174.0" y="678" text-anchor="middle" fill="#7d879c" font-size="17" font-weight="normal">aggregate, measured</text><text x="1174.0" y="712" text-anchor="middle" fill="#e8a87c" font-size="16" letter-spacing="2" font-weight="bold">SHIPPING NEXT</text><path d="M 1289.5 542.0 L 1300.5 550.0 L 1289.5 558.0" fill="none" stroke="#7d879c" stroke-width="3"/><rect x="1303" y="372" width="228" height="356" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="1343" cy="414" r="21" fill="#2dd4bf"/><text x="1343" y="423" text-anchor="middle" fill="#14181f" font-size="24" font-weight="bold">6</text><text x="1377" y="424" fill="#f5f6f8" font-size="27" font-weight="bold">PROVE</text><text x="1327" y="478" fill="#b3bccb" font-size="20">quality, speed and</text><text x="1327" y="506" fill="#b3bccb" font-size="20">tasks re-measured</text><rect x="1323" y="550" width="188" height="40" rx="8" fill="#14181f" stroke="#2a3340"/><text x="1417.0" y="576" text-anchor="middle" fill="#2dd4bf" font-size="17" font-family="Consolas, Menlo, monospace">quantprobe bench</text><line x1="1327" y1="616" x2="1507" y2="616" stroke="#2a3340" stroke-width="1.5"/><text x="1417.0" y="652" text-anchor="middle" fill="#f5f6f8" font-size="20" font-weight="bold">misses published</text><text x="1417.0" y="678" text-anchor="middle" fill="#7d879c" font-size="17" font-weight="normal">at full size</text><rect x="88" y="764" width="1424" height="92" rx="18" fill="#1c222c" stroke="#14b8a6" stroke-width="2"/><text x="122" y="802" fill="#2dd4bf" font-size="19" letter-spacing="3">WHAT MAKES IT DIFFERENT</text><text x="122" y="836" fill="#f5f6f8" font-size="23">Other tools help you pick a quantization someone else built. This one measures your model, then builds a file that exists only for your hardware.</text><rect x="80" y="894" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="894" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="894" width="480.0" height="4" fill="#a84b32"/><text x="80" y="942" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="942" text-anchor="end" fill="#7d879c" font-size="19">every stage number measured on a GTX 1060 6GB · sources in the repo</text></svg>