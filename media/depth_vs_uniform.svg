="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED · Qwen2.5-7B · ONE SESSION · SAME BOX, SAME FLAGS</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">Same bytes. Better model.</text><text x="80" y="216" fill="#b3bccb" font-size="24">Uniform Q2_K against a quantization built from this model's own fragility probe - at equal file size.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><rect x="92" y="300" width="1416" height="96" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="126" y="340" fill="#2dd4bf" font-size="19" letter-spacing="3">THE CONDITION THAT MAKES THIS A CLAIM</text><text x="126" y="376" fill="#f5f6f8" font-size="24">3.016 GB uniform vs 3.030 GB depth-aware = <tspan fill="#2dd4bf" font-weight="bold">+0.48% size</tspan>. Bytes are the budget; where the protection goes is the treatment.</text><rect x="92" y="424" width="348" height="300" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="266.0" y="464" text-anchor="middle" fill="#2dd4bf" font-size="18" letter-spacing="2">PERPLEXITY</text><text x="266.0" y="490" text-anchor="middle" fill="#7d879c" font-size="17">wikitext-2 held out</text><text x="266.0" y="542" text-anchor="middle" fill="#7d879c" font-size="30">9.579</text><text x="266.0" y="570" text-anchor="middle" fill="#7d879c" font-size="16" letter-spacing="2">UNIFORM Q2_K</text><text x="266.0" y="608" text-anchor="middle" fill="#b3bccb" font-size="26">&#8595;</text><text x="266.0" y="656" text-anchor="middle" fill="#f5f6f8" font-size="48" font-weight="bold">8.319</text><text x="266.0" y="684" text-anchor="middle" fill="#2dd4bf" font-size="16" letter-spacing="2">DEPTH-AWARE</text><text x="266.0" y="714" text-anchor="middle" fill="#2dd4bf" font-size="24" font-weight="bold">-13.2%</text><rect x="460" y="424" width="348" height="300" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="634.0" y="464" text-anchor="middle" fill="#2dd4bf" font-size="18" letter-spacing="2">KL DIVERGENCE, median</text><text x="634.0" y="490" text-anchor="middle" fill="#7d879c" font-size="17">vs the f16 teacher</text><text x="634.0" y="542" text-anchor="middle" fill="#7d879c" font-size="30">0.268</text><text x="634.0" y="570" text-anchor="middle" fill="#7d879c" font-size="16" letter-spacing="2">UNIFORM Q2_K</text><text x="634.0" y="608" text-anchor="middle" fill="#b3bccb" font-size="26">&#8595;</text><text x="634.0" y="656" text-anchor="middle" fill="#f5f6f8" font-size="48" font-weight="bold">0.162</text><text x="634.0" y="684" text-anchor="middle" fill="#2dd4bf" font-size="16" letter-spacing="2">DEPTH-AWARE</text><text x="634.0" y="714" text-anchor="middle" fill="#2dd4bf" font-size="24" font-weight="bold">-39.6%</text><rect x="828" y="424" width="348" height="300" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="1002.0" y="464" text-anchor="middle" fill="#2dd4bf" font-size="18" letter-spacing="2">SAME TOP TOKEN</text><text x="1002.0" y="490" text-anchor="middle" fill="#7d879c" font-size="17">agreement with teacher</text><text x="1002.0" y="542" text-anchor="middle" fill="#7d879c" font-size="30">70.34%</text><text x="1002.0" y="570" text-anchor="middle" fill="#7d879c" font-size="16" letter-spacing="2">UNIFORM Q2_K</text><text x="1002.0" y="608" text-anchor="middle" fill="#b3bccb" font-size="26">&#8595;</text><text x="1002.0" y="656" text-anchor="middle" fill="#f5f6f8" font-size="48" font-weight="bold">75.47%</text><text x="1002.0" y="684" text-anchor="middle" fill="#2dd4bf" font-size="16" letter-spacing="2">DEPTH-AWARE</text><text x="1002.0" y="714" text-anchor="middle" fill="#2dd4bf" font-size="24" font-weight="bold">+5.13 pts</text><rect x="1196" y="424" width="348" height="300" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="1370.0" y="464" text-anchor="middle" fill="#2dd4bf" font-size="18" letter-spacing="2">DECODE SPEED</text><text x="1370.0" y="490" text-anchor="middle" fill="#7d879c" font-size="17">tg128 - a staked MISS, see below</text><text x="1370.0" y="542" text-anchor="middle" fill="#7d879c" font-size="30">21.41 tok/s</text><text x="1370.0" y="570" text-anchor="middle" fill="#7d879c" font-size="16" letter-spacing="2">UNIFORM Q2_K</text><text x="1370.0" y="608" text-anchor="middle" fill="#b3bccb" font-size="26">&#8595;</text><text x="1370.0" y="656" text-anchor="middle" fill="#f5f6f8" font-size="48" font-weight="bold">22.82 tok/s</text><text x="1370.0" y="684" text-anchor="middle" fill="#2dd4bf" font-size="16" letter-spacing="2">DEPTH-AWARE</text><text x="1370.0" y="714" text-anchor="middle" fill="#2dd4bf" font-size="24" font-weight="bold">+6.6%</text><rect x="92" y="764" width="1416" height="150" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="126" y="804" fill="#a84b32" font-size="19" letter-spacing="3">THE PREDICTION THAT FAILED</text><text x="126" y="842" fill="#f5f6f8" font-size="23">P3 staked decode speed as INVARIANT (+/-3%). It came in +6.6% faster - a good outcome and a wrong prediction.</text><text x="126" y="874" fill="#b3bccb" font-size="22">Published as a miss because the band was staked symmetric. Also measured and reported: 52/52 business-task verdicts were</text><text x="126" y="902" fill="#b3bccb" font-size="22">IDENTICAL across both arms - at n=52 the task suite cannot see a difference that KL divergence resolves easily.</text><rect x="80" y="954" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="954" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="954" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1002" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1002" text-anchor="end" fill="#7d879c" font-size="19">prereg 2026-08-04-a2a-depth-aware-vs-uniform · scored same day</text></svg>