b8613f"/><rect x="132" y="144" width="12" height="12" fill="#b8613f"/><rect x="132" y="156" width="12" height="12" fill="#b8613f"/><rect x="132" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="132" width="12" height="12" fill="#b8613f"/><rect x="168" y="132" width="12" height="12" fill="#b8613f"/><rect x="180" y="132" width="12" height="12" fill="#b8613f"/><rect x="156" y="144" width="12" height="12" fill="#b8613f"/><rect x="156" y="156" width="12" height="12" fill="#b8613f"/><rect x="156" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="180" width="12" height="12" fill="#b8613f"/><rect x="204" y="132" width="12" height="12" fill="#b8613f"/><rect x="216" y="132" width="12" height="12" fill="#b8613f"/><rect x="228" y="132" width="12" height="12" fill="#b8613f"/><rect x="204" y="144" width="12" height="12" fill="#b8613f"/><rect x="228" y="144" width="12" height="12" fill="#b8613f"/><rect x="204" y="156" width="12" height="12" fill="#b8613f"/><rect x="228" y="156" width="12" height="12" fill="#b8613f"/><rect x="204" y="168" width="12" height="12" fill="#b8613f"/><rect x="228" y="168" width="12" height="12" fill="#b8613f"/><rect x="204" y="180" width="12" height="12" fill="#b8613f"/><rect x="216" y="180" width="12" height="12" fill="#b8613f"/><rect x="228" y="180" width="12" height="12" fill="#b8613f"/><rect x="252" y="132" width="12" height="12" fill="#b8613f"/><rect x="252" y="144" width="12" height="12" fill="#b8613f"/><rect x="252" y="156" width="12" height="12" fill="#b8613f"/><rect x="264" y="156" width="12" height="12" fill="#b8613f"/><rect x="276" y="156" width="12" height="12" fill="#b8613f"/><rect x="252" y="168" width="12" height="12" fill="#b8613f"/><rect x="276" y="168" width="12" height="12" fill="#b8613f"/><rect x="252" y="180" width="12" height="12" fill="#b8613f"/><rect x="264" y="180" width="12" height="12" fill="#b8613f"/><rect x="276" y="180" width="12" height="12" fill="#b8613f"/><rect x="300" y="132" width="12" height="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED &#183; Qwen3.6-35B-A3B &#183; 13.15 GiB FILE, 12.5 GB FREE RAM &#183; ONE SESSION</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">Your benchmark runs contaminate each other</text><text x="80" y="216" fill="#b3bccb" font-size="24">Five runs of one unchanged command, 11.3 to 70.7 tok/s. The scatter is not noise - it is which config ran immediately before.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><rect x="80" y="300" width="960" height="520" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="108" y="338" fill="#7d879c" font-size="19" letter-spacing="3">PREFILL tok/s &#183; EVERY ARM, SPLIT BY ITS PREDECESSOR</text><text x="108" y="364" fill="#2dd4bf" font-size="18">&#9679; predecessor used the SAME k<tspan fill="#a84b32">     &#9679; predecessor used a LOWER k</tspan></text><line x1="200" y1="750.0" x2="1010" y2="750.0" stroke="#2a3340" stroke-width="1.5"/><text x="182" y="757.0" text-anchor="end" fill="#7d879c" font-size="18">0</text><line x1="200" y1="681.2" x2="1010" y2="681.2" stroke="#2a3340" stroke-width="1.5"/><text x="182" y="688.2" text-anchor="end" fill="#7d879c" font-size="18">25</text><line x1="200" y1="612.3" x2="1010" y2="612.3" stroke="#2a3340" stroke-width="1.5"/><text x="182" y="619.3" text-anchor="end" fill="#7d879c" font-size="18">50</text><line x1="200" y1="543.5" x2="1010" y2="543.5" stroke="#2a3340" stroke-width="1.5"/><text x="182" y="550.5" text-anchor="end" fill="#7d879c" font-size="18">75</text><line x1="200" y1="474.6" x2="1010" y2="474.6" stroke="#2a3340" stroke-width="1.5"/><text x="182" y="481.6" text-anchor="end" fill="#7d879c" font-size="18">100</text><line x1="200" y1="405.8" x2="1010" y2="405.8" stroke="#2a3340" stroke-width="1.5"/><text x="182" y="412.8" text-anchor="end" fill="#7d879c" font-size="18">125</text><text x="402.5" y="792.0" text-anchor="middle" fill="#f5f6f8" font-size="24" font-weight="bold">k=8</text><text x="402.5" y="818.0" text-anchor="middle" fill="#7d879c" font-size="18">5 runs, identical command</text><circle cx="297.5" cy="610.1" r="14" fill="#2dd4bf"/><text x="297.5" y="584.1" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">50.8</text><circle cx="349.5" cy="555.3" r="14" fill="#a84b32"/><text x="349.5" y="529.3" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">70.7</text><circle cx="401.5" cy="609.3" r="14" fill="#2dd4bf"/><text x="401.5" y="583.3" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">51.1</text><circle cx="453.5" cy="718.9" r="14" fill="#a84b32"/><text x="453.5" y="692.9" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">11.3</text><circle cx="505.5" cy="604.9" r="14" fill="#2dd4bf"/><text x="505.5" y="578.9" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">52.7</text><rect x="277.5" y="588.9" width="250" height="37.2" rx="8" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="7 5"/><text x="542.5" y="614.5" text-anchor="start" fill="#2dd4bf" font-size="19">1.8% spread</text><text x="807.5" y="792.0" text-anchor="middle" fill="#f5f6f8" font-size="24" font-weight="bold">k=4</text><text x="807.5" y="818.0" text-anchor="middle" fill="#7d879c" font-size="18">5 runs, identical command</text><circle cx="702.5" cy="522.0" r="14" fill="#2dd4bf"/><text x="702.5" y="496.0" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">82.8</text><circle cx="754.5" cy="437.4" r="14" fill="#a84b32"/><text x="754.5" y="411.4" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">113.5</text><circle cx="806.5" cy="519.0" r="14" fill="#2dd4bf"/><text x="806.5" y="493.0" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">83.9</text><circle cx="858.5" cy="545.7" r="14" fill="#a84b32"/><text x="858.5" y="519.7" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">74.2</text><circle cx="910.5" cy="522.5" r="14" fill="#2dd4bf"/><text x="910.5" y="496.5" text-anchor="middle" fill="#f5f6f8" font-size="19" font-weight="bold">82.6</text><rect x="682.5" y="503.0" width="250" height="35.6" rx="8" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="7 5"/><text x="667.5" y="527.7" text-anchor="end" fill="#2dd4bf" font-size="19">0.8% spread</text><rect x="1070" y="300" width="450" height="520" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="1098" y="344" fill="#a84b32" font-size="19" letter-spacing="3">FROM RUN ORDER ALONE</text><text x="1098" y="440" fill="#a84b32" font-size="96" font-weight="bold">6.3x</text><text x="1098" y="486" fill="#b3bccb" font-size="21">span between the fastest and slowest</text><text x="1098" y="516" fill="#b3bccb" font-size="21">reading of the same command - 70.7</text><text x="1098" y="546" fill="#b3bccb" font-size="21">against 11.3 tok/s.</text><text x="1098" y="586" fill="#2dd4bf" font-size="19" letter-spacing="3">WHY</text><text x="1098" y="622" fill="#b3bccb" font-size="21">The file is larger than free RAM, so</text><text x="1098" y="652" fill="#b3bccb" font-size="21">the page cache carries the previous</text><text x="1098" y="682" fill="#b3bccb" font-size="21">run's working set into the next</text><text x="1098" y="712" fill="#b3bccb" font-size="21">process, so a config that touched</text><text x="1098" y="742" fill="#b3bccb" font-size="21">fewer experts leaves the wrong pages</text><text x="1098" y="772" fill="#b3bccb" font-size="21">resident for the one that needs</text><text x="1098" y="802" fill="#b3bccb" font-size="21">more.</text><rect x="80" y="854" width="1440" height="232" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="108" y="896" fill="#2dd4bf" font-size="19" letter-spacing="3">WHAT TO DO INSTEAD</text><text x="108" y="936" fill="#b3bccb" font-size="22">Interleave your arms and repeat them - run A B C, then C B A, then A B C again, and compare only readings whose</text><text x="108" y="967" fill="#b3bccb" font-size="22">predecessor matched. Three passes of that put every arm inside 2%. If you A/B two configs back to back on a model bigger</text><text x="108" y="998" fill="#b3bccb" font-size="22">than your RAM, you are comparing cache states as much as configurations, and the difference you publish may be entirely</text><text x="108" y="1029" fill="#b3bccb" font-size="22">run order. quantprobe v1.31 warns when your model is in this regime.</text><rect x="80" y="1174" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1174" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1174" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1222" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1222" text-anchor="end" fill="#7d879c" font-size="19">prereg #108 &#183; L-31 &#183; found while measuring something else</text></svg>