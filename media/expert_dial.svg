="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED &#183; Qwen3.6-35B-A3B &#183; 256 EXPERTS, k=8 &#183; PREDICTED FROM THE FILE FIRST</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">The MoE speed dial nobody should turn</text><text x="80" y="216" fill="#b3bccb" font-size="24">Using fewer experts is traded as free speed on small hardware. It is bounded by arithmetic you can read off the file - and it is never free.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><rect x="80" y="300" width="740" height="430" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="108" y="336" fill="#7d879c" font-size="19" letter-spacing="3">SPEEDUP vs k=8 &#183; LAW 4 PREDICTED THIS BEFORE MEASURING</text><text x="108" y="362" fill="#7d879c" font-size="18">dashed = predicted from the file&#8217;s byte split &#183; <tspan fill="#e8a87c">k=1 beat that ceiling by 17%</tspan></text><line x1="176" y1="645.3" x2="760" y2="645.3" stroke="#2a3340" stroke-width="1.5"/><text x="160" y="652.3" text-anchor="end" fill="#7d879c" font-size="18">1.0x</text><line x1="176" y1="600.0" x2="760" y2="600.0" stroke="#2a3340" stroke-width="1.5"/><text x="160" y="607.0" text-anchor="end" fill="#7d879c" font-size="18">1.1x</text><line x1="176" y1="554.7" x2="760" y2="554.7" stroke="#2a3340" stroke-width="1.5"/><text x="160" y="561.7" text-anchor="end" fill="#7d879c" font-size="18">1.2x</text><line x1="176" y1="509.3" x2="760" y2="509.3" stroke="#2a3340" stroke-width="1.5"/><text x="160" y="516.3" text-anchor="end" fill="#7d879c" font-size="18">1.3x</text><line x1="176" y1="464.0" x2="760" y2="464.0" stroke="#2a3340" stroke-width="1.5"/><text x="160" y="471.0" text-anchor="end" fill="#7d879c" font-size="18">1.4x</text><line x1="176" y1="418.7" x2="760" y2="418.7" stroke="#2a3340" stroke-width="1.5"/><text x="160" y="425.7" text-anchor="end" fill="#7d879c" font-size="18">1.5x</text><polyline points="176.0,645.3 370.7,588.7 565.3,554.7 760.0,535.6" fill="none" stroke="#7d879c" stroke-width="4" stroke-dasharray="10 7"/><polyline points="176.0,645.3 370.7,579.0 565.3,566.0 760.0,441.0" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linejoin="round"/><circle cx="176.0" cy="645.3" r="8" fill="#7d879c"/><circle cx="176.0" cy="645.3" r="13" fill="#2dd4bf"/><text x="192.0" y="619.3" text-anchor="start" fill="#f5f6f8" font-size="22" font-weight="bold">1.00x</text><text x="176.0" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=8</text><circle cx="370.7" cy="588.7" r="8" fill="#7d879c"/><circle cx="370.7" cy="579.0" r="13" fill="#2dd4bf"/><text x="370.7" y="553.0" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">1.15x</text><text x="370.7" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=4</text><circle cx="565.3" cy="554.7" r="8" fill="#7d879c"/><circle cx="565.3" cy="566.0" r="13" fill="#2dd4bf"/><text x="565.3" y="540.0" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">1.18x</text><text x="565.3" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=2</text><circle cx="760.0" cy="535.6" r="8" fill="#7d879c"/><circle cx="760.0" cy="441.0" r="13" fill="#e8a87c"/><text x="760.0" y="415.0" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">1.45x</text><text x="760.0" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=1</text><rect x="860" y="300" width="660" height="430" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="888" y="336" fill="#a84b32" font-size="19" letter-spacing="3">PERPLEXITY &#183; LOG SCALE &#183; LOWER IS BETTER</text><line x1="970" y1="639.8" x2="1470" y2="639.8" stroke="#2a3340" stroke-width="1.5"/><text x="954" y="646.8" text-anchor="end" fill="#7d879c" font-size="18">10</text><line x1="970" y1="546.1" x2="1470" y2="546.1" stroke="#2a3340" stroke-width="1.5"/><text x="954" y="553.1" text-anchor="end" fill="#7d879c" font-size="18">100</text><line x1="970" y1="452.4" x2="1470" y2="452.4" stroke="#2a3340" stroke-width="1.5"/><text x="954" y="459.4" text-anchor="end" fill="#7d879c" font-size="18">1000</text><polyline points="970.0,660.8 1136.7,651.7 1303.3,608.8 1470.0,418.9" fill="none" stroke="#a84b32" stroke-width="6" stroke-linejoin="round"/><circle cx="970.0" cy="660.8" r="13" fill="#a84b32"/><text x="970.0" y="634.8" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">5.96</text><text x="970.0" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=8</text><circle cx="1136.7" cy="651.7" r="13" fill="#a84b32"/><text x="1136.7" y="625.7" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">7.47</text><text x="1136.7" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=4</text><circle cx="1303.3" cy="608.8" r="13" fill="#a84b32"/><text x="1303.3" y="582.8" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">21.42</text><text x="1303.3" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=2</text><circle cx="1470.0" cy="418.9" r="13" fill="#a84b32"/><text x="1470.0" y="392.9" text-anchor="middle" fill="#f5f6f8" font-size="22" font-weight="bold">2,277</text><text x="1470.0" y="702.0" text-anchor="middle" fill="#7d879c" font-size="20">k=1</text><rect x="80" y="764" width="1440" height="200" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="108" y="806" fill="#2dd4bf" font-size="19" letter-spacing="3">THERE IS NO GOOD POINT ON THIS CURVE</text><text x="108" y="846" fill="#b3bccb" font-size="22">Halving the experts buys 15% - a gain most people would not notice - for +1.51 perplexity, which they would. Going to</text><text x="108" y="877" fill="#b3bccb" font-size="22">one expert of 256 buys 45% and the model is gone. All of it was readable before anything ran: the routed experts own 22%</text><text x="108" y="908" fill="#b3bccb" font-size="22">of the active bytes, so 78% of the work is untouched no matter what k does. quantprobe v1.30 prints that ceiling for</text><text x="108" y="939" fill="#b3bccb" font-size="22">your own file.</text><rect x="80" y="994" width="464.0" height="172" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="312.0" y="1038" text-anchor="middle" fill="#2dd4bf" font-size="19" letter-spacing="3">LAW 4 ERROR AT k=4 AND k=2</text><text x="312.0" y="1102" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">+1.9% / -2.1%</text><text x="312.0" y="1140" text-anchor="middle" fill="#b3bccb" font-size="18">predicted from the file, before measuring</text><rect x="568.0" y="994" width="464.0" height="172" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="800.0" y="1038" text-anchor="middle" fill="#a84b32" font-size="19" letter-spacing="3">WHAT k=4 COSTS</text><text x="800.0" y="1102" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">+1.51 PPL</text><text x="800.0" y="1140" text-anchor="middle" fill="#b3bccb" font-size="18">for 15% more speed</text><rect x="1056.0" y="994" width="464.0" height="172" rx="18" fill="#1c222c" stroke="#e8a87c" stroke-width="2"/><text x="1288.0" y="1038" text-anchor="middle" fill="#e8a87c" font-size="19" letter-spacing="3">CEILING, FROM THE FILE ALONE</text><text x="1288.0" y="1102" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">1.24x</text><text x="1288.0" y="1140" text-anchor="middle" fill="#b3bccb" font-size="18">even at k=1 - 22% of bytes are routed</text><rect x="80" y="1234" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1234" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1234" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1282" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1282" text-anchor="end" fill="#7d879c" font-size="19">prereg #107 &#183; scored 4/4 &#183; L-30, V-22</text></svg>