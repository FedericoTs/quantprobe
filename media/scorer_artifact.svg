b8613f"/><rect x="132" y="144" width="12" height="12" fill="#b8613f"/><rect x="132" y="156" width="12" height="12" fill="#b8613f"/><rect x="132" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="132" width="12" height="12" fill="#b8613f"/><rect x="168" y="132" width="12" height="12" fill="#b8613f"/><rect x="180" y="132" width="12" height="12" fill="#b8613f"/><rect x="156" y="144" width="12" height="12" fill="#b8613f"/><rect x="156" y="156" width="12" height="12" fill="#b8613f"/><rect x="156" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="180" width="12" height="12" fill="#b8613f"/><rect x="204" y="132" width="12" height="12" fill="#b8613f"/><rect x="216" y="132" width="12" height="12" fill="#b8613f"/><rect x="228" y="132" width="12" height="12" fill="#b8613f"/><rect x="204" y="144" width="12" height="12" fill="#b8613f"/><rect x="228" y="144" width="12" height="12" fill="#b8613f"/><rect x="204" y="156" width="12" height="12" fill="#b8613f"/><rect x="228" y="156" width="12" height="12" fill="#b8613f"/><rect x="204" y="168" width="12" height="12" fill="#b8613f"/><rect x="228" y="168" width="12" height="12" fill="#b8613f"/><rect x="204" y="180" width="12" height="12" fill="#b8613f"/><rect x="216" y="180" width="12" height="12" fill="#b8613f"/><rect x="228" y="180" width="12" height="12" fill="#b8613f"/><rect x="252" y="132" width="12" height="12" fill="#b8613f"/><rect x="252" y="144" width="12" height="12" fill="#b8613f"/><rect x="252" y="156" width="12" height="12" fill="#b8613f"/><rect x="264" y="156" width="12" height="12" fill="#b8613f"/><rect x="276" y="156" width="12" height="12" fill="#b8613f"/><rect x="252" y="168" width="12" height="12" fill="#b8613f"/><rect x="276" y="168" width="12" height="12" fill="#b8613f"/><rect x="252" y="180" width="12" height="12" fill="#b8613f"/><rect x="264" y="180" width="12" height="12" fill="#b8613f"/><rect x="276" y="180" width="12" height="12" fill="#b8613f"/><rect x="300" y="132" width="12" height="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED · lm-evaluation-harness 0.4.12 · FOUR TASKS, ONE FAILURE MODE</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">When the scorer picks the winner</text><text x="80" y="216" fill="#b3bccb" font-size="24">A benchmark score can be a property of its scorer - and it does not only depress scores. It can invert the ranking.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><rect x="80" y="286" width="1440" height="210" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="118" y="330" fill="#7d879c" font-size="19" letter-spacing="3">GSM8K · THE SAME 1,319 RESPONSES FROM EACH MODEL, SCORED TWO WAYS</text><text x="118" y="378" fill="#b3bccb" font-size="21">strict-match</text><text x="380" y="382" fill="#a84b32" font-size="44" font-weight="bold">0.0%</text><text x="510" y="382" fill="#7d879c" font-size="21">Qwen3.5-4B</text><text x="780" y="382" fill="#a84b32" font-size="44" font-weight="bold">24.5%</text><text x="940" y="382" fill="#7d879c" font-size="21">Qwen3-Coder-30B</text><text x="1482" y="382" text-anchor="end" fill="#a84b32" font-size="22" font-weight="bold">a 24.5-point rout</text><text x="118" y="438" fill="#b3bccb" font-size="21">flexible-extract</text><text x="380" y="442" fill="#2dd4bf" font-size="44" font-weight="bold">81.7%</text><text x="510" y="442" fill="#7d879c" font-size="21">Qwen3.5-4B</text><text x="780" y="442" fill="#2dd4bf" font-size="44" font-weight="bold">82.6%</text><text x="940" y="442" fill="#7d879c" font-size="21">Qwen3-Coder-30B</text><text x="1482" y="442" text-anchor="end" fill="#2dd4bf" font-size="22" font-weight="bold">a dead heat</text><text x="118" y="478" fill="#f5f6f8" font-size="19">The 30B is not better at maths. It is better at a sentence: it writes &#8220;The answer is N.&#8221; in 27% of replies. The others, never.</text><rect x="80" y="542" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="586" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">GSM8K  cot_zeroshot  strict-match</text><text x="114" y="632" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="632" fill="#b3bccb" font-size="21">the literal sentence  "The answer is N."</text><text x="114" y="676" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="676" fill="#f5f6f8" font-size="21">"Therefore, Janet makes $18 every day at the farmers' market."</text><line x1="114" y1="700" x2="1486" y2="700" stroke="#2a3340" stroke-width="1"/><text x="114" y="734" fill="#a84b32" font-size="21" font-weight="bold">SCORED  0 of 3,957 across 0.6B/4B/7B; the 30B alone matches 27%</text><text x="1486" y="734" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">36.8 / 81.7 / 79.9 / 82.6<tspan fill="#7d879c" font-weight="normal" font-size="19">   flexible-extract, same responses</tspan></text><rect x="80" y="782" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="826" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">MATH-500  hendrycks extractor</text><text x="114" y="872" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="872" fill="#b3bccb" font-size="21">the slice between the FIRST $ and the LAST $</text><text x="114" y="916" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="916" fill="#f5f6f8" font-size="21">a well-formed \boxed{} answer, in 95.4% of the 0.6B's replies</text><line x1="114" y1="940" x2="1486" y2="940" stroke="#2a3340" stroke-width="1"/><text x="114" y="974" fill="#a84b32" font-size="21" font-weight="bold">SCORED  0.00%</text><text x="1486" y="974" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">46.4%<tspan fill="#7d879c" font-weight="normal" font-size="19">   an extractor that reads \boxed{}</tspan></text><rect x="80" y="1022" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="1066" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">AIME 2024  zero-shot</text><text x="114" y="1112" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="1112" fill="#b3bccb" font-size="21">$...$ or \boxed{} - but the prompt asks for neither</text><text x="114" y="1156" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="1156" fill="#f5f6f8" font-size="21">"Answer: 49"  - the 4B wrote it bare in 30 of 30 items</text><line x1="114" y1="1180" x2="1486" y2="1180" stroke="#2a3340" stroke-width="1"/><text x="114" y="1214" fill="#a84b32" font-size="21" font-weight="bold">SCORED  0.0%</text><text x="1486" y="1214" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">33.3%<tspan fill="#7d879c" font-weight="normal" font-size="19">   the same model, asked for the format</tspan></text><rect x="80" y="1262" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="1306" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">AIME 2024  OUR OWN extractor</text><text x="114" y="1352" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="1352" fill="#b3bccb" font-size="21">the LAST \boxed{} - unbalanced if generation was cut off</text><text x="114" y="1396" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="1396" fill="#f5f6f8" font-size="21">\boxed{116} - correct - then 683 repeats, truncated mid-token</text><line x1="114" y1="1420" x2="1486" y2="1420" stroke="#2a3340" stroke-width="1"/><text x="114" y="1454" fill="#a84b32" font-size="21" font-weight="bold">SCORED  33.3%</text><text x="1486" y="1454" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">50.0%<tspan fill="#7d879c" font-weight="normal" font-size="19">   the last WELL-FORMED box</tspan></text><text x="80" y="1516" fill="#f5f6f8" font-size="26" font-weight="bold">The rule, and its blind spot</text><text x="80" y="1556" fill="#b3bccb" font-size="21">A metric that is EXACTLY 0.0 across unrelated model sizes is a format mismatch, not a difficulty wall. Real capability</text><text x="80" y="1584" fill="#b3bccb" font-size="21">differences are ragged; they do not line up on 0.0000 for a 0.6B and a 30B. The extractor simply never fired.</text><text x="80" y="1632" fill="#f5f6f8" font-size="20">That rule missed the fourth case - our own. Those rows read 33.3% and 36.7%, not zero: the loss was five items hidden inside a plausible</text><text x="80" y="1661" fill="#f5f6f8" font-size="20">score. A uniform zero is the LOUD version of this failure. The quiet version needs a per-item check, and it is cheap - a response that</text><text x="80" y="1690" fill="#f5f6f8" font-size="20">plainly contains a well-formed answer while the scorer calls it ungradeable is a scorer bug, every time.</text><text x="80" y="1742" fill="#7d879c" font-size="19">Not a bug report. GSM8K strict-match is right for the FEW-SHOT variant it came from, where the exemplars taught the model to write that sentence.</text><text x="80" y="1769" fill="#7d879c" font-size="19">Zero-shot inherited the filter, not the exemplars.</text><rect x="80" y="1790" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1790" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1790" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1838" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1838" text-anchor="end" fill="#7d879c" font-size="19">C-25 · weights/ev1_report.py · prereg 2026-08-06-ev1-standard-benches</text></svg>