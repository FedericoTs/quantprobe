b8613f"/><rect x="132" y="144" width="12" height="12" fill="#b8613f"/><rect x="132" y="156" width="12" height="12" fill="#b8613f"/><rect x="132" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="132" width="12" height="12" fill="#b8613f"/><rect x="168" y="132" width="12" height="12" fill="#b8613f"/><rect x="180" y="132" width="12" height="12" fill="#b8613f"/><rect x="156" y="144" width="12" height="12" fill="#b8613f"/><rect x="156" y="156" width="12" height="12" fill="#b8613f"/><rect x="156" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="180" width="12" height="12" fill="#b8613f"/><rect x="204" y="132" width="12" height="12" fill="#b8613f"/><rect x="216" y="132" width="12" height="12" fill="#b8613f"/><rect x="228" y="132" width="12" height="12" fill="#b8613f"/><rect x="204" y="144" width="12" height="12" fill="#b8613f"/><rect x="228" y="144" width="12" height="12" fill="#b8613f"/><rect x="204" y="156" width="12" height="12" fill="#b8613f"/><rect x="228" y="156" width="12" height="12" fill="#b8613f"/><rect x="204" y="168" width="12" height="12" fill="#b8613f"/><rect x="228" y="168" width="12" height="12" fill="#b8613f"/><rect x="204" y="180" width="12" height="12" fill="#b8613f"/><rect x="216" y="180" width="12" height="12" fill="#b8613f"/><rect x="228" y="180" width="12" height="12" fill="#b8613f"/><rect x="252" y="132" width="12" height="12" fill="#b8613f"/><rect x="252" y="144" width="12" height="12" fill="#b8613f"/><rect x="252" y="156" width="12" height="12" fill="#b8613f"/><rect x="264" y="156" width="12" height="12" fill="#b8613f"/><rect x="276" y="156" width="12" height="12" fill="#b8613f"/><rect x="252" y="168" width="12" height="12" fill="#b8613f"/><rect x="276" y="168" width="12" height="12" fill="#b8613f"/><rect x="252" y="180" width="12" height="12" fill="#b8613f"/><rect x="264" y="180" width="12" height="12" fill="#b8613f"/><rect x="276" y="180" width="12" height="12" fill="#b8613f"/><rect x="300" y="132" width="12" height="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED · lm-evaluation-harness 0.4.12 · THREE TASKS, ONE FAILURE MODE</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">The zero that is not the model's fault</text><text x="80" y="216" fill="#b3bccb" font-size="24">A benchmark score can be a property of its scorer. When it is, the tell is sharp - and cheap to check.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><rect x="80" y="286" width="1440" height="150" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="118" y="332" fill="#7d879c" font-size="19" letter-spacing="3">GSM8K STRICT-MATCH · RESPONSES THAT MATCHED WHAT IT ASKED FOR</text><text x="118" y="404" fill="#2dd4bf" font-size="72" font-weight="bold">0 of 3,957</text><text x="550" y="404" fill="#b3bccb" font-size="26">across a 0.6B, a 4B and a 7B - not a low rate, exactly zero</text><rect x="80" y="482" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="526" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">GSM8K  cot_zeroshot  strict-match</text><text x="114" y="572" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="572" fill="#b3bccb" font-size="21">the literal sentence  "The answer is N."</text><text x="114" y="616" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="616" fill="#f5f6f8" font-size="21">"Therefore, Janet makes $18 every day at the farmers' market."</text><line x1="114" y1="640" x2="1486" y2="640" stroke="#2a3340" stroke-width="1"/><text x="114" y="674" fill="#a84b32" font-size="21" font-weight="bold">SCORED  0 of 3,957 responses matched, across three models</text><text x="1486" y="674" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">36.8 / 81.7 / 79.9<tspan fill="#7d879c" font-weight="normal" font-size="19">   flexible-extract, same responses</tspan></text><rect x="80" y="722" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="766" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">MATH-500  hendrycks extractor</text><text x="114" y="812" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="812" fill="#b3bccb" font-size="21">the slice between the FIRST $ and the LAST $</text><text x="114" y="856" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="856" fill="#f5f6f8" font-size="21">a well-formed \boxed{} answer, in 95.4% of the 0.6B's replies</text><line x1="114" y1="880" x2="1486" y2="880" stroke="#2a3340" stroke-width="1"/><text x="114" y="914" fill="#a84b32" font-size="21" font-weight="bold">SCORED  0.00%</text><text x="1486" y="914" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">46.4%<tspan fill="#7d879c" font-weight="normal" font-size="19">   an extractor that reads \boxed{}</tspan></text><rect x="80" y="962" width="1440" height="214" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="114" y="1006" fill="#f5f6f8" font-size="25" font-weight="bold" font-family="Consolas, Menlo, monospace">AIME 2024  zero-shot</text><text x="114" y="1052" fill="#7d879c" font-size="18" letter-spacing="2">THE SCORER WANTED</text><text x="380" y="1052" fill="#b3bccb" font-size="21">$...$ or \boxed{} - but the prompt asks for neither</text><text x="114" y="1096" fill="#7d879c" font-size="18" letter-spacing="2">THE MODEL WROTE</text><text x="380" y="1096" fill="#f5f6f8" font-size="21">"Answer: 49"  - the 4B wrote it bare in 30 of 30 items</text><line x1="114" y1="1120" x2="1486" y2="1120" stroke="#2a3340" stroke-width="1"/><text x="114" y="1154" fill="#a84b32" font-size="21" font-weight="bold">SCORED  0.0%</text><text x="1486" y="1154" text-anchor="end" fill="#2dd4bf" font-size="21" font-weight="bold">33.3%<tspan fill="#7d879c" font-weight="normal" font-size="19">   the same model, asked for the format</tspan></text><text x="80" y="1216" fill="#f5f6f8" font-size="26" font-weight="bold">The rule that falls out of it</text><text x="80" y="1256" fill="#b3bccb" font-size="21">A metric that is EXACTLY 0.0 across unrelated model sizes is a format mismatch, not a difficulty wall. Real capability</text><text x="80" y="1284" fill="#b3bccb" font-size="21">differences are ragged; they do not line up on 0.0000 for a 0.6B and a 30B. The extractor simply never fired.</text><text x="80" y="1324" fill="#7d879c" font-size="19">Not a bug report. GSM8K strict-match is right for the FEW-SHOT variant it came from, where the exemplars taught the model to write that sentence.</text><text x="80" y="1351" fill="#7d879c" font-size="19">Zero-shot inherited the filter, not the exemplars.</text><rect x="80" y="1406" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1406" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1406" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1454" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1454" text-anchor="end" fill="#7d879c" font-size="19">C-25 · weights/ev1_report.py · prereg 2026-08-06-ev1-standard-benches</text></svg>