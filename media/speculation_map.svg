weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1256" text-anchor="end" fill="#7d879c" font-size="19">preregs #28 / #42 / #67 / #71 · register V-04, V-20, D-09, D-10</text></svg>