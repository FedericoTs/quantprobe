ze="64" font-weight="bold">55.7%</text><text x="1130.0" y="806" text-anchor="middle" fill="#f5f6f8" font-size="30" font-weight="bold">Qwen3-Coder-30B</text><text x="1130.0" y="842" text-anchor="middle" fill="#b3bccb" font-size="21">writes tests for its OWN code - 7.5x larger</text><text x="1130.0" y="874" text-anchor="middle" fill="#7d879c" font-size="19">n = 492 test sets</text><text x="800.0" y="912" text-anchor="middle" fill="#2dd4bf" font-size="30" font-weight="bold">the fix is not a bigger model - it is running the tests</text><text x="800.0" y="948" text-anchor="middle" fill="#b3bccb" font-size="20">every failing set was caught by execution and never trained on - the null and mutation gates held</text><rect x="80" y="984" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="984" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="984" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1032" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1032" text-anchor="end" fill="#7d879c" font-size="19">weights/data/phaseb_gen.log + phaseb_verdict.json - prereg 2026-08-05-phase-b-data-engine</text></svg>