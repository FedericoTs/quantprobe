#a84b32" font-size="17" font-weight="bold">IQ</text><text x="278" y="804" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold" font-family="Consolas, Menlo, monospace">Q2_K</text><rect x="300" y="784" width="361.9" height="30" rx="6" fill="#e8a87c" opacity="1"/><text x="675.8800000000001" y="806" fill="#f5f6f8" font-size="20" font-weight="bold">65.4</text><text x="743.8800000000001" y="806" fill="#7d879c" font-size="17">GB/s</text><text x="278" y="844" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold" font-family="Consolas, Menlo, monospace">IQ3_S</text><rect x="300" y="824" width="338.1" height="30" rx="6" fill="#a84b32" opacity="1"/><text x="652.0866666666666" y="846" fill="#f5f6f8" font-size="20" font-weight="bold">61.1</text><text x="720.0866666666666" y="846" fill="#7d879c" font-size="17">GB/s</text><text x="1280" y="846" fill="#a84b32" font-size="17" font-weight="bold">IQ</text><text x="278" y="884" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold" font-family="Consolas, Menlo, monospace">Q3_K</text><rect x="300" y="864" width="317.1" height="30" rx="6" fill="#e8a87c" opacity="1"/><text x="631.06" y="886" fill="#f5f6f8" font-size="20" font-weight="bold">57.3</text><text x="699.06" y="886" fill="#7d879c" font-size="17">GB/s</text><text x="278" y="924" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold" font-family="Consolas, Menlo, monospace">IQ2_XS</text><rect x="300" y="904" width="282.8" height="30" rx="6" fill="#a84b32" opacity="1"/><text x="596.7533333333333" y="926" fill="#f5f6f8" font-size="20" font-weight="bold">51.1</text><text x="664.7533333333333" y="926" fill="#7d879c" font-size="17">GB/s</text><text x="1280" y="926" fill="#a84b32" font-size="17" font-weight="bold">IQ</text><text x="278" y="964" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold" font-family="Consolas, Menlo, monospace">IQ2_XXS</text><rect x="300" y="944" width="254.5" height="30" rx="6" fill="#a84b32" opacity="1"/><text x="568.5333333333333" y="966" fill="#f5f6f8" font-size="20" font-weight="bold">46</text><text x="636.5333333333333" y="966" fill="#7d879c" font-size="17">GB/s</text><text x="1280" y="966" fill="#a84b32" font-size="17" font-weight="bold">IQ</text><rect x="300" y="996" width="20" height="20" rx="4" fill="#7d879c"/><text x="328" y="1013" fill="#b3bccb" font-size="18">no unpack</text><rect x="426.4" y="996" width="20" height="20" rx="4" fill="#2dd4bf"/><text x="454.4" y="1013" fill="#b3bccb" font-size="18">simple unpack (dp4a)</text><rect x="658.4" y="996" width="20" height="20" rx="4" fill="#e8a87c"/><text x="686.4" y="1013" fill="#b3bccb" font-size="18">K-quant: fine metadata</text><rect x="909.5999999999999" y="996" width="20" height="20" rx="4" fill="#a84b32"/><text x="937.5999999999999" y="1013" fill="#b3bccb" font-size="18">codebook lookup</text><rect x="92" y="1042" width="700" height="150" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="126" y="1080" fill="#2dd4bf" font-size="19" letter-spacing="3">THE SPREAD</text><text x="126" y="1134" fill="#f5f6f8" font-size="46" font-weight="bold">2.6x</text><text x="126" y="1168" fill="#b3bccb" font-size="20">Q4_0 119.1 vs IQ2_XXS 46 GB/s at comparable size.</text><rect x="816" y="1042" width="692" height="150" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="850" y="1080" fill="#a84b32" font-size="19" letter-spacing="3">AND THE RULE EVERYONE USES IS WRONG</text><text x="850" y="1118" fill="#f5f6f8" font-size="22">"IQ is slow" is false. <tspan font-weight="bold">IQ4_NL measures 117.0</tspan> - beside Q4_0.</text><text x="850" y="1148" fill="#b3bccb" font-size="20">The divide is CODEBOOK vs not, not IQ vs K. Codebook formats</text><text x="850" y="1176" fill="#b3bccb" font-size="20">pay a grid lookup inside the decode loop; IQ4_NL does not.</text><text x="92" y="1228" fill="#7d879c" font-size="17">Mechanism (L-16): the K-quant deficit is metadata application DENSITY - scale+min per 16 weights forces a metadata FMA every 4 bytes at 2 bits. Confirmation arm, identical loads and dp4a count,</text><text x="92" y="1252" fill="#7d879c" font-size="17">scale applied per-u32 instead of per-quad: 83.8 -> 103.2 GB/s (+23%). Scope: one Pascal card; these are upper bounds carrying the measured model's FFN shape and row width.</text><rect x="80" y="1294" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1294" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1294" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1342" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1342" text-anchor="end" fill="#7d879c" font-size="19">quantprobe/spec.py FORMAT_EBW · L-15/L-16 · preregs #52/#70</text></svg>