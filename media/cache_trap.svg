t="12" fill="#b8613f"/><rect x="180" y="48" width="12" height="12" fill="#b8613f"/><rect x="156" y="60" width="12" height="12" fill="#b8613f"/><rect x="180" y="60" width="12" height="12" fill="#b8613f"/><rect x="156" y="72" width="12" height="12" fill="#b8613f"/><rect x="168" y="72" width="12" height="12" fill="#b8613f"/><rect x="180" y="72" width="12" height="12" fill="#b8613f"/><rect x="204" y="24" width="12" height="12" fill="#b8613f"/><rect x="216" y="24" width="12" height="12" fill="#b8613f"/><rect x="228" y="24" width="12" height="12" fill="#b8613f"/><rect x="204" y="36" width="12" height="12" fill="#b8613f"/><rect x="228" y="36" width="12" height="12" fill="#b8613f"/><rect x="204" y="48" width="12" height="12" fill="#b8613f"/><rect x="228" y="48" width="12" height="12" fill="#b8613f"/><rect x="204" y="60" width="12" height="12" fill="#b8613f"/><rect x="228" y="60" width="12" height="12" fill="#b8613f"/><rect x="204" y="72" width="12" height="12" fill="#b8613f"/><rect x="228" y="72" width="12" height="12" fill="#b8613f"/><rect x="264" y="24" width="12" height="12" fill="#b8613f"/><rect x="252" y="36" width="12" height="12" fill="#b8613f"/><rect x="264" y="36" width="12" height="12" fill="#b8613f"/><rect x="276" y="36" width="12" height="12" fill="#b8613f"/><rect x="264" y="48" width="12" height="12" fill="#b8613f"/><rect x="264" y="60" width="12" height="12" fill="#b8613f"/><rect x="264" y="72" width="12" height="12" fill="#b8613f"/><rect x="276" y="72" width="12" height="12" fill="#b8613f"/><rect x="96" y="132" width="12" height="12" fill="#b8613f"/><rect x="96" y="180" width="12" height="12" fill="#b8613f"/><rect x="108" y="132" width="12" height="12" fill="#b8613f"/><rect x="108" y="180" width="12" height="12" fill="#b8613f"/><rect x="120" y="132" width="12" height="12" fill="#b8613f"/><rect x="120" y="180" width="12" height="12" fill="#b8613f"/><rect x="132" y="132" width="12" height="12" fill="#b8613f"/><rect x="132" y="180" width="12" height="12" fill="#b8613f"/><rect x="132" y="144" width="12" height="12" fill="#b8613f"/><rect x="132" y="156" width="12" height="12" fill="#b8613f"/><rect x="132" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="132" width="12" height="12" fill="#b8613f"/><rect x="168" y="132" width="12" height="12" fill="#b8613f"/><rect x="180" y="132" width="12" height="12" fill="#b8613f"/><rect x="156" y="144" width="12" height="12" fill="#b8613f"/><rect x="156" y="156" width="12" height="12" fill="#b8613f"/><rect x="156" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="180" width="12" height="12" fill="#b8613f"/><rect x="204" y="132" width="12" height="12" fill="#b8613f"/><rect x="216" y="132" width="12" height="12" fill="#b8613f"/><rect x="228" y="132" width="12" height="12" fill="#b8613f"/><rect x="204" y="144" width="12" height="12" fill="#b8613f"/><rect x="228" y="144" width="12" height="12" fill="#b8613f"/><rect x="204" y="156" width="12" height="12" fill="#b8613f"/><rect x="228" y="156" width="12" height="12" fill="#b8613f"/><rect x="204" y="168" width="12" height="12" fill="#b8613f"/><rect x="228" y="168" width="12" height="12" fill="#b8613f"/><rect x="204" y="180" width="12" height="12" fill="#b8613f"/><rect x="216" y="180" width="12" height="12" fill="#b8613f"/><rect x="228" y="180" width="12" height="12" fill="#b8613f"/><rect x="252" y="132" width="12" height="12" fill="#b8613f"/><rect x="252" y="144" width="12" height="12" fill="#b8613f"/><rect x="252" y="156" width="12" height="12" fill="#b8613f"/><rect x="264" y="156" width="12" height="12" fill="#b8613f"/><rect x="276" y="156" width="12" height="12" fill="#b8613f"/><rect x="252" y="168" width="12" height="12" fill="#b8613f"/><rect x="276" y="168" width="12" height="12" fill="#b8613f"/><rect x="252" y="180" width="12" height="12" fill="#b8613f"/><rect x="264" y="180" width="12" height="12" fill="#b8613f"/><rect x="276" y="180" width="12" height="12" fill="#b8613f"/><rect x="300" y="132" width="12" height="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED &#183; Qwen3.6-35B-A3B &#183; 13.15 GiB FILE, 12.28 GB FREE RAM &#183; ONE SESSION</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">The cache trick that makes it slower</text><text x="80" y="216" fill="#b3bccb" font-size="24">Reading a model file once to "warm the cache" is standard advice. When the file is bigger than your RAM, it costs you.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><rect x="80" y="300" width="950" height="430" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="108" y="336" fill="#7d879c" font-size="19" letter-spacing="3">DECODE tok/s &#183; SIX CONSECUTIVE RUNS OF ONE UNCHANGED COMMAND</text><line x1="176" y1="668.0" x2="992" y2="668.0" stroke="#2a3340" stroke-width="1.5"/><text x="158" y="675.0" text-anchor="end" fill="#7d879c" font-size="19">11</text><line x1="176" y1="594.9767441860465" x2="992" y2="594.9767441860465" stroke="#2a3340" stroke-width="1.5"/><text x="158" y="601.9767441860465" text-anchor="end" fill="#7d879c" font-size="19">12</text><line x1="176" y1="521.953488372093" x2="992" y2="521.953488372093" stroke="#2a3340" stroke-width="1.5"/><text x="158" y="528.953488372093" text-anchor="end" fill="#7d879c" font-size="19">13</text><line x1="176" y1="448.93023255813955" x2="992" y2="448.93023255813955" stroke="#2a3340" stroke-width="1.5"/><text x="158" y="455.93023255813955" text-anchor="end" fill="#7d879c" font-size="19">14</text><line x1="176" y1="375.90697674418607" x2="992" y2="375.90697674418607" stroke="#2a3340" stroke-width="1.5"/><text x="158" y="382.90697674418607" text-anchor="end" fill="#7d879c" font-size="19">15</text><line x1="176" y1="386.1302325581396" x2="992" y2="386.1302325581396" stroke="#7d879c" stroke-width="3" stroke-dasharray="10 8"/><text x="186" y="372.1302325581396" fill="#7d879c" font-size="20">14.86 &#8212; what we used to publish. Never reached in 6 tries.</text><polyline points="176.0,519.0 316.8,511.7 457.6,457.0 598.4,424.8 739.2,417.5 880.0,432.1" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linejoin="round"/><circle cx="176.0" cy="519.0" r="12" fill="#2dd4bf"/><text x="176.0" y="493.0" text-anchor="middle" fill="#f5f6f8" font-size="21" font-weight="bold">13.04</text><text x="176.0" y="702.0" text-anchor="middle" fill="#7d879c" font-size="19">run 1</text><circle cx="316.8" cy="511.7" r="12" fill="#2dd4bf"/><text x="316.8" y="485.7" text-anchor="middle" fill="#f5f6f8" font-size="21" font-weight="bold">13.14</text><text x="316.8" y="702.0" text-anchor="middle" fill="#7d879c" font-size="19">run 2</text><circle cx="457.6" cy="457.0" r="12" fill="#2dd4bf"/><text x="457.6" y="431.0" text-anchor="middle" fill="#f5f6f8" font-size="21" font-weight="bold">13.89</text><text x="457.6" y="702.0" text-anchor="middle" fill="#7d879c" font-size="19">run 3</text><circle cx="598.4" cy="424.8" r="12" fill="#2dd4bf"/><text x="598.4" y="398.8" text-anchor="middle" fill="#f5f6f8" font-size="21" font-weight="bold">14.33</text><text x="598.4" y="702.0" text-anchor="middle" fill="#7d879c" font-size="19">run 4</text><circle cx="739.2" cy="417.5" r="12" fill="#2dd4bf"/><text x="739.2" y="391.5" text-anchor="middle" fill="#f5f6f8" font-size="21" font-weight="bold">14.43</text><text x="739.2" y="702.0" text-anchor="middle" fill="#7d879c" font-size="19">run 5</text><circle cx="880.0" cy="432.1" r="12" fill="#2dd4bf"/><text x="880.0" y="406.1" text-anchor="middle" fill="#f5f6f8" font-size="21" font-weight="bold">14.23</text><text x="880.0" y="702.0" text-anchor="middle" fill="#7d879c" font-size="19">run 6</text><line x1="920" y1="344" x2="920" y2="678" stroke="#394355" stroke-width="2" stroke-dasharray="6 6"/><line x1="880.0" y1="432.1" x2="972" y2="603.0" stroke="#a84b32" stroke-width="6" stroke-dasharray="12 7"/><circle cx="972" cy="603.0" r="15" fill="#a84b32"/><text x="972" y="649.0" text-anchor="middle" fill="#a84b32" font-size="30" font-weight="bold">11.89</text><text x="972" y="702.0" text-anchor="middle" fill="#a84b32" font-size="19" letter-spacing="1">PRIMED</text><rect x="1060" y="300" width="460" height="430" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="1088" y="344" fill="#a84b32" font-size="19" letter-spacing="3">THE PREDICTION THAT FAILED</text><text x="1088" y="404" fill="#b3bccb" font-size="21">We staked priming at</text><text x="1088" y="452" fill="#b3bccb" font-size="40" font-weight="bold">+1.0 tok/s</text><text x="1088" y="496" fill="#7d879c" font-size="21">It measured</text><text x="1088" y="562" fill="#a84b32" font-size="72" font-weight="bold">-1.95</text><text x="1088" y="612" fill="#b3bccb" font-size="21">The sign came out wrong. Staked</text><text x="1088" y="642" fill="#b3bccb" font-size="21">before the arm ran, so it ships as a</text><text x="1088" y="672" fill="#b3bccb" font-size="21">miss at the same size as the hits.</text><rect x="80" y="764" width="1440" height="178" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="108" y="804" fill="#2dd4bf" font-size="19" letter-spacing="3">WHY &#8212; AND WHY IT IS NOT JUST A NOISY MACHINE</text><text x="108" y="842" fill="#b3bccb" font-size="22">A 13.15 GiB file cannot fit in 12.28 GB of free RAM, so a sequential read ends with the cache holding the file's LAST</text><text x="108" y="873" fill="#b3bccb" font-size="22">~12 GB. Six real runs instead leave it holding the pages the model actually re-reads &#8212; for a sparse MoE, the hot</text><text x="108" y="904" fill="#b3bccb" font-size="22">experts. Priming swaps a frequency-adapted cache for a position-adapted one, and position is the wrong key. Control: a</text><text x="108" y="935" fill="#b3bccb" font-size="22">4.36 GiB model that DOES fit held a 2.1% spread with no ramp at all, against this file's 10.0%.</text><rect x="80" y="972" width="464.0" height="172" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="312.0" y="1016" text-anchor="middle" fill="#2dd4bf" font-size="19" letter-spacing="3">WARM-UP, RUN 1 TO BEST</text><text x="312.0" y="1080" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">+10.7%</text><text x="312.0" y="1118" text-anchor="middle" fill="#b3bccb" font-size="18">same command, nothing changed</text><rect x="568.0" y="972" width="464.0" height="172" rx="18" fill="#1c222c" stroke="#a84b32" stroke-width="2"/><text x="800.0" y="1016" text-anchor="middle" fill="#a84b32" font-size="19" letter-spacing="3">COST OF PRIMING</text><text x="800.0" y="1080" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">-14%</text><text x="800.0" y="1118" text-anchor="middle" fill="#b3bccb" font-size="18">vs the six-run mean</text><rect x="1056.0" y="972" width="464.0" height="172" rx="18" fill="#1c222c" stroke="#e8a87c" stroke-width="2"/><text x="1288.0" y="1016" text-anchor="middle" fill="#e8a87c" font-size="19" letter-spacing="3">SPREAD, FITS vs DOES NOT</text><text x="1288.0" y="1080" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">2.1% / 10.0%</text><text x="1288.0" y="1118" text-anchor="middle" fill="#b3bccb" font-size="18">4.36 GiB model vs this one</text><rect x="80" y="1194" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1194" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1194" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1242" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1242" text-anchor="end" fill="#7d879c" font-size="19">prereg #106 &#183; scored 2/4 &#183; L-29, D-29</text></svg>