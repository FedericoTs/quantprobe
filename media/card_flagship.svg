d by <tspan fill="#e8a87c">system RAM bandwidth (51% of every token)</tspan></text><text x="110" y="738" fill="#7d879c" font-size="14">derived from the law, not confirmed by variance attribution (prereg #95)</text><text x="80" y="808" fill="#7d879c" font-size="20">hybrid CPU/GPU - MoE expert offload, planned by quantprobe</text><rect x="740" y="320" width="780" height="470" rx="18" fill="#1c222c" stroke="#343d4d" stroke-width="1.5"/><text x="776" y="372" fill="#f5f6f8" font-size="26" font-weight="bold">decode vs context depth <tspan fill="#7d879c" font-size="20">tok/s</tspan></text><text x="1490" y="372" text-anchor="end" fill="#7d879c" font-size="17">committed points shown</text><line x1="830" y1="710.0" x2="1460" y2="710.0" stroke="#2a3340" stroke-width="1.5"/><text x="814" y="718.0" text-anchor="end" fill="#7d879c" font-size="20">0</text><line x1="830" y1="605.7480080422965" x2="1460" y2="605.7480080422965" stroke="#2a3340" stroke-width="1.5"/><text x="814" y="613.7480080422965" text-anchor="end" fill="#7d879c" font-size="20">10</text><line x1="830" y1="501.49601608459307" x2="1460" y2="501.49601608459307" stroke="#2a3340" stroke-width="1.5"/><text x="814" y="509.49601608459307" text-anchor="end" fill="#7d879c" font-size="20">20</text><polyline points="830.0,494.61538461538464 1460.0,514.527515079306" fill="none" stroke="#e8a87c" stroke-width="6" stroke-linecap="round"/><circle cx="830.0" cy="494.61538461538464" r="14" fill="#e8a87c" stroke="#14181f" stroke-width="4"/><text x="830.0" y="464.61538461538464" text-anchor="middle" fill="#f5f6f8" font-size="32" font-weight="bold">20.66</text><text x="830.0" y="750" text-anchor="middle" fill="#b3bccb" font-size="22">fresh</text><circle cx="1460.0" cy="514.527515079306" r="14" fill="#e8a87c" stroke="#14181f" stroke-width="4"/><text x="1460.0" y="484.527515079306" text-anchor="middle" fill="#f5f6f8" font-size="32" font-weight="bold">18.75</text><text x="1460.0" y="750" text-anchor="middle" fill="#b3bccb" font-size="22">4