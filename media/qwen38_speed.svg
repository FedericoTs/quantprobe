b8613f"/><rect x="132" y="144" width="12" height="12" fill="#b8613f"/><rect x="132" y="156" width="12" height="12" fill="#b8613f"/><rect x="132" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="132" width="12" height="12" fill="#b8613f"/><rect x="168" y="132" width="12" height="12" fill="#b8613f"/><rect x="180" y="132" width="12" height="12" fill="#b8613f"/><rect x="156" y="144" width="12" height="12" fill="#b8613f"/><rect x="156" y="156" width="12" height="12" fill="#b8613f"/><rect x="156" y="168" width="12" height="12" fill="#b8613f"/><rect x="156" y="180" width="12" height="12" fill="#b8613f"/><rect x="204" y="132" width="12" height="12" fill="#b8613f"/><rect x="216" y="132" width="12" height="12" fill="#b8613f"/><rect x="228" y="132" width="12" height="12" fill="#b8613f"/><rect x="204" y="144" width="12" height="12" fill="#b8613f"/><rect x="228" y="144" width="12" height="12" fill="#b8613f"/><rect x="204" y="156" width="12" height="12" fill="#b8613f"/><rect x="228" y="156" width="12" height="12" fill="#b8613f"/><rect x="204" y="168" width="12" height="12" fill="#b8613f"/><rect x="228" y="168" width="12" height="12" fill="#b8613f"/><rect x="204" y="180" width="12" height="12" fill="#b8613f"/><rect x="216" y="180" width="12" height="12" fill="#b8613f"/><rect x="228" y="180" width="12" height="12" fill="#b8613f"/><rect x="252" y="132" width="12" height="12" fill="#b8613f"/><rect x="252" y="144" width="12" height="12" fill="#b8613f"/><rect x="252" y="156" width="12" height="12" fill="#b8613f"/><rect x="264" y="156" width="12" height="12" fill="#b8613f"/><rect x="276" y="156" width="12" height="12" fill="#b8613f"/><rect x="252" y="168" width="12" height="12" fill="#b8613f"/><rect x="276" y="168" width="12" height="12" fill="#b8613f"/><rect x="252" y="180" width="12" height="12" fill="#b8613f"/><rect x="264" y="180" width="12" height="12" fill="#b8613f"/><rect x="276" y="180" width="12" height="12" fill="#b8613f"/><rect x="300" y="132" width="12" height="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">Qwen3.8-27B · GTX 1060 6GB ($50, 2016) · PREDICTED, THEN MEASURED</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">Will the new model run on your machine?</text><text x="80" y="216" fill="#b3bccb" font-size="24">quantprobe answered from the file header before the model generated a token. Then llama-bench measured it.</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><text x="80" y="346" fill="#7d879c" font-size="20" letter-spacing="3">quantprobe PREDICTED</text><rect x="560" y="302" width="547" height="84" rx="10" fill="#b3bccb"/><text x="1133" y="362" fill="#f5f6f8" font-size="64" font-weight="bold">1.80</text><text x="1133" y="394" fill="#7d879c" font-size="20">tok/s</text><text x="80" y="412" fill="#b3bccb" font-size="19">from the GGUF header + a one-time calibrate - no download needed</text><text x="80" y="536" fill="#7d879c" font-size="20" letter-spacing="3">llama-bench MEASURED</text><rect x="560" y="492" width="620" height="84" rx="10" fill="#2dd4bf"/><text x="1206" y="552" fill="#f5f6f8" font-size="64" font-weight="bold">2.04</text><text x="1206" y="584" fill="#7d879c" font-size="20">tok/s</text><text x="80" y="602" fill="#b3bccb" font-size="19">tg128, +/-0.02 over runs, model split 15/65 layers GPU/RAM</text><rect x="80" y="690" width="1440" height="130" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="118" y="745" fill="#2dd4bf" font-size="46" font-weight="bold">+13%</text><text x="300" y="738" fill="#f5f6f8" font-size="24">prediction vs reality - and the miss is in the FLOOR direction (real speed came out faster)</text><text x="300" y="772" fill="#7d879c" font-size="19">on the first hybrid linear-attention model ever released - an architecture the law was not built for</text><text x="80" y="870" fill="#7d879c" font-size="18">The point is not this model: it is that you can check YOURS. quantprobe reads any GGUF header, measures your machine once (calibrate), and prices every</text><text x="80" y="896" fill="#7d879c" font-size="18">placement before you spend the download or the money. It also names WHICH resource binds - here, system RAM bandwidth (88% of every token) - so the</text><text x="80" y="922" fill="#7d879c" font-size="18">upgrade advice is physics, not vibes.</text><text x="80" y="963.6" fill="#7d879c" font-size="18">Disclosed: the same run exposed a real tool gap - quantprobe prices KV as if all 64 layers were full attention, but 48 are linear (fixed state), a ~4x KV</text><text x="80" y="989.6" fill="#7d879c" font-size="18">over-estimate that is negligible at short context and will be fixed as its own change (U-51). Prediction bands are honest because the misses ship at the</text><text x="80" y="1015.6" fill="#7d879c" font-size="18">same size as the hits.</text><rect x="80" y="1044" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1044" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1044" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1092" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1092" text-anchor="end" fill="#7d879c" font-size="19">prereg #101 P-5 · weights/data/qwen38_plan.log · qwen38_bench.log</text></svg>