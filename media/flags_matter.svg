="12" fill="#b8613f"/><rect x="312" y="132" width="12" height="12" fill="#b8613f"/><rect x="324" y="132" width="12" height="12" fill="#b8613f"/><rect x="300" y="144" width="12" height="12" fill="#b8613f"/><rect x="324" y="144" width="12" height="12" fill="#b8613f"/><rect x="300" y="156" width="12" height="12" fill="#b8613f"/><rect x="312" y="156" width="12" height="12" fill="#b8613f"/><rect x="300" y="168" width="12" height="12" fill="#b8613f"/><rect x="300" y="180" width="12" height="12" fill="#b8613f"/><rect x="312" y="180" width="12" height="12" fill="#b8613f"/><rect x="324" y="180" width="12" height="12" fill="#b8613f"/></g><text x="266" y="92" fill="#7d879c" font-size="20" letter-spacing="4">MEASURED - 150 MORRIS RUNS - ONE MACHINE STATE - STAKED 2026-08-07</text><text x="266" y="152" fill="#f5f6f8" font-size="58" font-weight="bold">Three flags are the whole story</text><text x="80" y="216" fill="#b3bccb" font-size="24">Morris ranks every flag by mu* - tok/s moved across the flag's range. Top three: 97% of the effect (dense), 77% (MoE split).</text><rect x="80" y="238" width="480.0" height="5" fill="#e8a87c"/><rect x="560.0" y="238" width="480.0" height="5" fill="#d97757"/><rect x="1040.0" y="238" width="480.0" height="5" fill="#a84b32"/><text x="80" y="296" fill="#f5f6f8" font-size="26" font-weight="bold">Qwen2.5-7B Q4_K_M</text><text x="80" y="322" fill="#7d879c" font-size="19">dense - the GPU-fit regime</text><text x="366" y="375" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold">-ngl  GPU layers</text><rect x="380" y="346" width="400" height="42" rx="7" fill="#2dd4bf" opacity="1"/><text x="792" y="375" fill="#f5f6f8" font-size="21" font-weight="bold">13.5</text><text x="390" y="375" fill="#14181f" font-size="18" font-weight="bold">tune this first</text><text x="366" y="439" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-t  CPU threads</text><rect x="380" y="410" width="127" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="519" y="439" fill="#f5f6f8" font-size="21" font-weight="bold">4.3</text><text x="366" y="503" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-fa  flash attention</text><rect x="380" y="474" width="23" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="415" y="503" fill="#f5f6f8" font-size="21" font-weight="bold">0.8</text><text x="366" y="567" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-ctk  KV cache type</text><rect x="380" y="538" width="12" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="404" y="567" fill="#f5f6f8" font-size="21" font-weight="bold">0.4</text><text x="366" y="631" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold">-ub  ubatch size</text><rect x="380" y="602" width="4" height="42" rx="7" fill="#e8a87c" opacity="1"/><text x="396" y="631" fill="#f5f6f8" font-size="21" font-weight="bold">0.1</text><text x="444" y="631" fill="#e8a87c" font-size="19">dead last - see the miss below</text><text x="366" y="695" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">--no-mmap</text><rect x="380" y="666" width="4" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="396" y="695" fill="#f5f6f8" font-size="21" font-weight="bold">0.1</text><text x="820" y="296" fill="#f5f6f8" font-size="26" font-weight="bold">Qwen3-30B-A3B Q2_K</text><text x="820" y="322" fill="#7d879c" font-size="19">MoE - experts split to CPU RAM</text><text x="1106" y="375" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold">-t  CPU threads</text><rect x="1120" y="346" width="400" height="42" rx="7" fill="#2dd4bf" opacity="1"/><text x="1532" y="375" fill="#f5f6f8" font-size="21" font-weight="bold">10.7</text><text x="1130" y="375" fill="#14181f" font-size="18" font-weight="bold">tune this first</text><text x="1106" y="439" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">--no-mmap</text><rect x="1120" y="410" width="263" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="1395" y="439" fill="#f5f6f8" font-size="21" font-weight="bold">7.0</text><text x="1106" y="503" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-ngl  GPU layers</text><rect x="1120" y="474" width="184" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="1316" y="503" fill="#f5f6f8" font-size="21" font-weight="bold">4.9</text><text x="1106" y="567" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-ot  expert offload</text><rect x="1120" y="538" width="126" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="1258" y="567" fill="#f5f6f8" font-size="21" font-weight="bold">3.4</text><text x="1106" y="631" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-ctk  KV cache type</text><rect x="1120" y="602" width="87" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="1219" y="631" fill="#f5f6f8" font-size="21" font-weight="bold">2.3</text><text x="1106" y="695" text-anchor="end" fill="#7d879c" font-size="21" font-weight="normal">-fa  flash attention</text><rect x="1120" y="666" width="27" height="42" rx="7" fill="#b3bccb" opacity="0.85"/><text x="1159" y="695" fill="#f5f6f8" font-size="21" font-weight="bold">0.7</text><text x="1106" y="759" text-anchor="end" fill="#f5f6f8" font-size="21" font-weight="bold">-ub  ubatch size</text><rect x="1120" y="730" width="15" height="42" rx="7" fill="#e8a87c" opacity="1"/><text x="1147" y="759" fill="#f5f6f8" font-size="21" font-weight="bold">0.4</text><text x="1195" y="759" fill="#e8a87c" font-size="19">dead last - see the miss below</text><rect x="80" y="854" width="462.6666666666667" height="172" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="311.33333333333337" y="898" text-anchor="middle" fill="#2dd4bf" font-size="19" letter-spacing="3">P-1 CONCENTRATION - PASS</text><text x="311.33333333333337" y="962" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">97% / 77%</text><text x="311.33333333333337" y="1000" text-anchor="middle" fill="#b3bccb" font-size="18">top-3 share of total effect - bar was 70%</text><rect x="568.6666666666667" y="854" width="462.6666666666667" height="172" rx="18" fill="#1c222c" stroke="#2dd4bf" stroke-width="2"/><text x="800.0000000000001" y="898" text-anchor="middle" fill="#2dd4bf" font-size="19" letter-spacing="3">P-2 REGIMES SPLIT - PASS</text><text x="800.0000000000001" y="962" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">ngl vs t</text><text x="800.0000000000001" y="1000" text-anchor="middle" fill="#b3bccb" font-size="18">dense tunes the GPU, the split tunes the CPU</text><rect x="1057.3333333333335" y="854" width="462.6666666666667" height="172" rx="18" fill="#1c222c" stroke="#e8a87c" stroke-width="2"/><text x="1288.6666666666667" y="898" text-anchor="middle" fill="#e8a87c" font-size="19" letter-spacing="3">P-4 OUR MISS - FAIL</text><text x="1288.6666666666667" y="962" text-anchor="middle" fill="#f5f6f8" font-size="52" font-weight="bold">sigma(-ub) last</text><text x="1288.6666666666667" y="1000" text-anchor="middle" fill="#b3bccb" font-size="18">we staked an interaction; decode never saw it</text><text x="80" y="1064" fill="#7d879c" font-size="18">THE MISS, DIAGNOSED: we staked that -ub would show interaction (high sigma) because -ub 2048 once measured +73% on the split and -39% all-in-VRAM. That</text><text x="80" y="1090" fill="#7d879c" font-size="18">asymmetry is a PREFILL effect - this experiment's response is decode only (tg128), and there -ub ranked last on both machines. The flag most tuning</text><text x="80" y="1116" fill="#7d879c" font-size="18">guides reach for first is the one that moves single-user decode the least. Prefill is a different regime; both numbers stand, in their own phases.</text><text x="80" y="1155.0" fill="#7d879c" font-size="18">Chain of custody: staked 2026-08-07 before any screening run; amended pre-data with 8 declared deviations; harness AND scorer committed before the first</text><text x="80" y="1181.0" fill="#7d879c" font-size="18">CSV row; 150 of 150 runs, 0 DNF, GPU settled to 38-49 C between every run; scored by the frozen scorer. The kill rule on the binding-constraint</text><text x="80" y="1207.0" fill="#7d879c" font-size="18">classifier (P-3) waits for stage-2 Sobol - it is still armed, not discharged.</text><text x="80" y="1246.0" fill="#7d879c" font-size="18">Method: Morris elementary effects (R=10 trajectories), the screening stage of bigattichouse's llama-optimize / robust DoE funnel - his design, our</text><text x="80" y="1272.0" fill="#7d879c" font-size="18">hardware and stakes. Unstaked observation for stage 2: --no-mmap is #2 on the split with the highest sigma, the strongest interaction candidate on the</text><text x="80" y="1298.0" fill="#7d879c" font-size="18">board.</text><rect x="80" y="1454" width="480.0" height="4" fill="#e8a87c"/><rect x="560.0" y="1454" width="480.0" height="4" fill="#d97757"/><rect x="1040.0" y="1454" width="480.0" height="4" fill="#a84b32"/><text x="80" y="1502" fill="#f5f6f8" font-size="24" font-weight="bold">quantprobe  <tspan fill="#2dd4bf" font-weight="normal">github.com/FedericoTs/quantprobe</tspan></text><text x="1520" y="1502" text-anchor="end" fill="#7d879c" font-size="19">prereg 2026-08-07-doe-flag-screening - weights/data/doe_morris_stage1.csv - prereg95_verdict.json</text></svg>