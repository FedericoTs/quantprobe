ext x="925.0" y="848" text-anchor="middle" fill="#f2f2f0" font-size="40" font-weight="bold">+4.3% over floor</text><text x="925.0" y="882" text-anchor="middle" fill="#b9bcc9" font-size="14">law said 19.8, C-02 semantics</text></g><g><rect x="1110.0" y="760" width="330.0" height="150" rx="14" fill="#14161f" stroke="#85b7eb" stroke-width="1.5"/><text x="1275.0" y="798" text-anchor="middle" fill="#85b7eb" font-size="15" letter-spacing="2">30B ON A 2016 GPU</text><text x="1275.0" y="848" text-anchor="middle" fill="#f2f2f0" font-size="40" font-weight="bold">20.7 t/s</text><text x="1275.0" y="882" text-anchor="middle" fill="#b9bcc9" font-size="14">30B MoE, 6 GB VRAM, 16 GB RAM</text></g><text x="60" y="965" fill="#7c8093" font-size="14">flags: llama-server -m Qwen3-30B-A3B-Q2_K.gguf -ngl 99 -ot blk\.(1[4-9]|[2-3][0-9]|4[0-7])\.ffn_.*_exps\.=CPU --no-mmap -b 1024 -ub 1024 --threads 4</text><text x="60" y="992" fill="#7c8093" font-size="14">one machine state per row (C-14) - GPU clocks logged before/after - predictions staked before measurement - misses published at full size</text><text x="60" y="1050" fill="#b9bcc9" font-size="19" font-weight="bold">quantprobe - <tspan fill="#5dcaa5">falsification-tested laws for local LLMs</tspan>  <tspan fill="#7c8093" font-size="15">github.com/FedericoTs/quantprobe - every number on this card is in the repo</tspan></text></svg>