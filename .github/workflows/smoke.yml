name: smoke
on: [push, pull_request]

# Least privilege: this job only checks out and runs tests. Without this block the token
# gets default write scopes it never uses (flagged by code scanning, 2026-08-04).
permissions:
  contents: read

# Pushing master and then a tag fires TWO runs of the same commit within seconds. On
# 2026-08-03 they raced each other on the HuggingFace tree API, rate-limited each other, and
# c3c1982 came back both green (13:53:28) and red (13:53:34) - identical code, six seconds
# apart. A suite whose colour depends on which of our own jobs got there first is worse than
# a slow one. Group by SHA so one commit runs once, whatever triggered it.
concurrency:
  group: smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pre-commit
      - run: pre-commit run --show-diff-on-failure --all-files
  smoke:
    # Windows is the platform this project is DEVELOPED and RELEASED from, and until now nothing
    # tested it: CI was ubuntu-only, so every Windows-specific path shipped on manual checks alone.
    # detect.py is the exposure - the driver registry read, the CIM DIMM query, the
    # GlobalMemoryStatusEx ctypes struct and the whole `os.name == "nt"` family have no Linux
    # counterpart, so a regression there is invisible to the ubuntu job. This is the v1.28.1 lesson
    # inverted: that release broke on GPU-less Linux and CI caught it precisely because CI was not
    # the devbox. The same argument requires a runner for the devbox's own OS.
    #
    # fail-fast: false so a break on one OS still reports the other - knowing whether a failure is
    # platform-specific or universal is most of the diagnosis.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install .
      - run: python tests/smoke.py
